# CD after green CI on main — publish image; optional smoke / AWS.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Repo name ends with "-" (system-design-interview-canvas-) which is an
          # invalid container reference; strip trailing punctuation and use a safe slug.
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$repo" ]; then repo=interview-canvas; fi
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/${owner}/${repo}:main,ghcr.io/${owner}/${repo}:${sha}" >> "$GITHUB_OUTPUT"
          echo "Using image ghcr.io/${owner}/${repo}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: publish
    if: needs.publish.result == 'success' && vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post-deploy /health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          base="${APP_URL%/}"
          for i in $(seq 1 30); do
            if curl -sf "${base}/health" | grep -q ok; then
              echo "smoke ok"
              exit 0
            fi
            sleep 5
          done
          echo "smoke failed for ${base}/health"
          exit 1

  # Live AWS recreate is intentionally manual (cost). Wire secrets later if needed.
  aws-notice:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: AWS CD policy
        run: |
          echo "Image published to GHCR."
          echo "AWS CloudFormation create/update stays manual — see docs/deployment.md and docs/release-process.md."
          echo "Set repository variable APP_URL to enable the smoke job against a live PoC."
