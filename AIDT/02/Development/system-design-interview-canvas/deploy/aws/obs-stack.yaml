AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Interview Canvas observability PoC — separate from the app stack.
  One EC2 runs Collector + Prometheus + Loki + Tempo + Grafana.
  Delete this stack the same day. Grafana is on the public internet (PoC only).

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: t3.small is the floor for five containers.

  RootVolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 100

  KeyName:
    Type: String
    Default: ""

  SshCidr:
    Type: String
    Default: ""

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasSshCidr: !Not [!Equals [!Ref SshCidr, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.43.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.43.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Obs Grafana :80 and OTLP :4317/:4318
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 4317
          ToPort: 4318
          CidrIp: 0.0.0.0/0
        - !If
          - HasSshCidr
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshCidr
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-eip

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/interview-canvas-obs-bootstrap.log) 2>&1

          dnf install -y docker
          case "$(uname -m)" in
            aarch64) COMPOSE_ARCH=aarch64 ;;
            x86_64)  COMPOSE_ARCH=x86_64 ;;
            *) echo unsupported; exit 1 ;;
          esac
          install -d /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${!COMPOSE_ARCH}" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          systemctl enable --now docker

          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048 status=none
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo "/swapfile none swap sw 0 0" >> /etc/fstab
          fi

          OBS=/opt/interview-canvas-obs
          mkdir -p "${!OBS}/grafana/provisioning/datasources" \
                   "${!OBS}/grafana/provisioning/dashboards/json"

          cat > "${!OBS}/compose.yaml" <<'EOF'
          name: interview-canvas-obs
          services:
            otel-collector:
              image: otel/opentelemetry-collector-contrib:0.118.0
              command: ["--config=/etc/otelcol/config.yaml"]
              volumes:
                - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
              ports:
                - "4317:4317"
                - "4318:4318"
              depends_on: [prometheus, loki, tempo]
            prometheus:
              image: prom/prometheus:v3.2.1
              command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            loki:
              image: grafana/loki:3.4.2
              command: ["-config.file=/etc/loki/local-config.yaml"]
            tempo:
              image: grafana/tempo:2.7.1
              command: ["-config.file=/etc/tempo.yaml"]
              volumes:
                - ./tempo.yaml:/etc/tempo.yaml:ro
            grafana:
              image: grafana/grafana:10.4.6
              environment:
                GF_SECURITY_ADMIN_USER: admin
                GF_SECURITY_ADMIN_PASSWORD: admin
                GF_AUTH_ANONYMOUS_ENABLED: "false"
                GF_UNIFIED_ALERTING_ENABLED: "false"
                GF_ALERTING_ENABLED: "false"
                GF_ANALYTICS_REPORTING_ENABLED: "false"
                GF_DATABASE_WAL: "true"
                GF_LOG_LEVEL: warn
              volumes:
                - grafana-data:/var/lib/grafana
                - ./grafana/provisioning:/etc/grafana/provisioning:ro
              ports:
                - "80:3000"
              depends_on: [prometheus, loki, tempo]
          volumes:
            grafana-data:
          EOF

          cat > "${!OBS}/otel-collector.yaml" <<'EOF'
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch:
          exporters:
            prometheus:
              endpoint: 0.0.0.0:8889
            otlphttp/loki:
              endpoint: http://loki:3100/otlp
              tls:
                insecure: true
            otlp/tempo:
              endpoint: tempo:4317
              tls:
                insecure: true
          service:
            pipelines:
              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [prometheus]
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlphttp/loki]
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [otlp/tempo]
          EOF

          cat > "${!OBS}/prometheus.yml" <<'EOF'
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: otel-collector
              static_configs:
                - targets: [otel-collector:8889]
          EOF

          cat > "${!OBS}/tempo.yaml" <<'EOF'
          server:
            http_listen_port: 3200
          distributor:
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
          ingester:
            max_block_duration: 5m
          storage:
            trace:
              backend: local
              wal:
                path: /tmp/tempo/wal
              local:
                path: /tmp/tempo/blocks
          EOF

          cat > "${!OBS}/grafana/provisioning/datasources/datasources.yaml" <<'EOF'
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki:3100
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo:3200
          EOF

          cat > "${!OBS}/grafana/provisioning/dashboards/dashboards.yaml" <<'EOF'
          apiVersion: 1
          providers:
            - name: interview-canvas
              orgId: 1
              folder: Interview Canvas
              type: file
              options:
                path: /etc/grafana/provisioning/dashboards/json
          EOF

          cat > "${!OBS}/grafana/provisioning/dashboards/json/canvas-metrics.json" <<'EOF'
          {
            "annotations": {"list": []},
            "editable": true,
            "panels": [
              {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "id": 1, "title": "Interview rooms created", "type": "timeseries", "targets": [{"expr": "interview_rooms_created_total", "legendFormat": "rooms", "refId": "A"}]},
              {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "id": 2, "title": "Active interview participants", "type": "timeseries", "targets": [{"expr": "active_interview_participants", "legendFormat": "participants", "refId": "A"}]},
              {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "id": 3, "title": "Canvas elements created", "type": "timeseries", "targets": [{"expr": "canvas_elements_created_total", "legendFormat": "elements", "refId": "A"}]},
              {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "id": 4, "title": "Component creation failures", "type": "timeseries", "targets": [{"expr": "component_creation_failures_total", "legendFormat": "failures", "refId": "A"}]}
            ],
            "schemaVersion": 39,
            "tags": ["interview-canvas", "otel"],
            "refresh": "10s",
            "time": {"from": "now-1h", "to": "now"},
            "title": "Interview Canvas metrics",
            "uid": "interview-canvas-metrics"
          }
          EOF

          cd "${!OBS}"
          docker compose -p interview-canvas-obs -f compose.yaml up -d
          echo "=== obs bootstrap complete ==="

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

Outputs:
  StackName:
    Value: !Ref AWS::StackName
  ElasticIp:
    Description: Grafana at http://THIS_IP/  (admin / admin). OTLP HTTP at http://THIS_IP:4318
    Value: !Ref ElasticIp
  GrafanaUrl:
    Value: !Sub http://${ElasticIp}/
  InstanceId:
    Value: !Ref Instance
  DeleteHint:
    Value: !Sub |
      aws cloudformation delete-stack --stack-name ${AWS::StackName} --region us-east-1
      aws cloudformation wait stack-delete-complete --stack-name ${AWS::StackName} --region us-east-1
