services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      # E: only — never store DB data under C:\Users\...
      - E:/IT_SPACES/AI/ZoomCamp/AIDT/03/Deployment/AgentRelay/docker/pgdata/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Hostname is the Compose service name — this is the Q4 answer.
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
    depends_on:
      postgres:
        condition: service_healthy
