id: 05_postgres_taxi_parquet_V2
namespace: zoomcamp

tasks:
  - id: extract_and_convert
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "green_data.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - pip install pandas pyarrow
      - wget -q "https://d37ci6vzurychx.cloudfront.net/trip-data/green_tripdata_2025-11.parquet" -O green_data.parquet
      - python3 -c "import pandas as pd; pd.read_parquet('green_data.parquet').to_csv('green_data.csv', index=False)"

  - id: create_table
    type: io.kestra.plugin.jdbc.postgresql.Queries
    sql: |
      DROP TABLE IF EXISTS public.green_tripdata_2025_11;
      CREATE TABLE public.green_tripdata_2025_11 (
          vendorid text,
          lpep_pickup_datetime timestamp,
          lpep_dropoff_datetime timestamp,
          store_and_fwd_flag text,
          ratecodeid text,
          pulocationid text,
          dolocationid text,
          passenger_count double precision,
          trip_distance double precision,
          fare_amount double precision,
          extra double precision,
          mta_tax double precision,
          tip_amount double precision,
          tolls_amount double precision,
          ehail_fee double precision,
          improvement_surcharge double precision,
          total_amount double precision,
          payment_type double precision, -- bigint에서 변경
          trip_type double precision,
          congestion_surcharge double precision,
          extra_col1 text
      );

  - id: copy_in
    type: io.kestra.plugin.jdbc.postgresql.CopyIn
    format: CSV
    from: "{{outputs.extract_and_convert.outputFiles['green_data.csv']}}"
    table: "public.green_tripdata_2025_11"
    header: true

pluginDefaults:
  - type: io.kestra.plugin.jdbc.postgresql
    values:
      url: jdbc:postgresql://pgdatabase:5432/ny_taxi
      username: root
      password: root