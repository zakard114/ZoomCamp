id: download_nyc_taxi_data
namespace: nyc.taxi
tasks:
  - id: download_green_tripdata
    type: io.kestra.core.tasks.scripts.Bash
    description: "Download Green Trip Data for November 2025"
    commands:
      - "wget -O /tmp/green_tripdata_2025-11.parquet https://d37ci6vzurychx.cloudfront.net/trip-data/green_tripdata_2025-11.parquet"

  - id: download_taxi_zones
    type: io.kestra.core.tasks.scripts.Bash
    description: "Download NYC Taxi zone lookup CSV"
    commands:
      - "wget -O /tmp/taxi_zone_lookup.csv https://github.com/DataTalksClub/nyc-tlc-data/releases/download/misc/taxi_zone_lookup.csv"
