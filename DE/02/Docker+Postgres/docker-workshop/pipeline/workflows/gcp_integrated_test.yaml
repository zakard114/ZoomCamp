id: gcp_integrated_test
namespace: company.team 

tasks:
  - id: "bigquery_query"
    type: "io.kestra.plugin.gcp.bigquery.Query"
    # projectId를 task 수준에서 직접 명시하거나 
    # 아래 pluginDefaults가 제대로 작동하는지 확인해야 합니다.
    projectId: "de-zoomcamp-02-zakard" 
    sql: |
      SELECT 1 as id, "John" as name
      UNION ALL
      SELECT 2 as id, "Doe" as name
    fetch: true

  - id: "log_data"
    type: "io.kestra.plugin.core.log.Log"
    message: "{{ outputs.bigquery_query.rows }}"

pluginDefaults:
  - type: io.kestra.plugin.gcp.bigquery.Query
    values:
      serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
      projectId: "de-zoomcamp-02-zakard"