id: my_first_bq_flow
namespace: dev

tasks:
  - id: extract_bq_data
    type: io.kestra.plugin.gcp.bigquery.Query
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      SELECT 'Hello' as col1, 123 as col2
    store: true

  - id: convert_to_csv
    type: io.kestra.plugin.serdes.csv.CsvWriter
    from: "{{ outputs.extract_bq_data.uri }}"

  - id: upload_to_drive
    type: io.kestra.plugin.googleworkspace.drive.Upload
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.convert_to_csv.uri }}" # 방금 만든 CSV 파일을 가져옴
    name: "Kestra_Result_File.csv"           # 구글 드라이브에 저장될 이름
    # parents: ["여러분의_구글_폴더_ID"]       # (선택사항) 특정 폴더에 넣고 싶을 때