id: big_query
namespace: zoomcamp
description: "GCS의 Parquet 데이터를 기반으로 BigQuery 최적화 테이블(Partition/Cluster) 생성"

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: green

variables:
  # 각 택시 타입에 따른 시간 컬럼 이름 분기 처리
  pickup_col: "{{ inputs.taxi == 'green' ? 'lpep_pickup_datetime' : 'tpep_pickup_datetime' }}"
  dropoff_col: "{{ inputs.taxi == 'green' ? 'lpep_dropoff_datetime' : 'tpep_dropoff_datetime' }}"

tasks:
  - id: bq_external_table
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.external_{{inputs.taxi}}_tripdata`
      OPTIONS (
        format = 'PARQUET',
        uris = ['gs://{{kv('GCP_BUCKET_NAME')}}/{{inputs.taxi}}/*.parquet']
      );

  - id: bq_non_partitioned_table
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.{{inputs.taxi}}_tripdata_non_partitioned` AS
      SELECT * FROM `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.external_{{inputs.taxi}}_tripdata`;

  - id: bq_partitioned_clustered_table
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.{{inputs.taxi}}_tripdata_partitioned_clustered`
      PARTITION BY DATE({{render(vars.pickup_col)}})
      CLUSTER BY VendorID AS
      SELECT 
          * EXCEPT({{render(vars.pickup_col)}}, {{render(vars.dropoff_col)}}),
          -- 파이썬에서 발생한 INT64 날짜 이슈를 여기서 바로 해결
          TIMESTAMP_MICROS(CAST({{render(vars.pickup_col)}} / 1000 AS INT64)) AS {{render(vars.pickup_col)}},
          TIMESTAMP_MICROS(CAST({{render(vars.dropoff_col)}} / 1000 AS INT64)) AS {{render(vars.dropoff_col)}}
      FROM `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.{{inputs.taxi}}_tripdata_non_partitioned`;

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP_SERVICE_ACCOUNT')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"