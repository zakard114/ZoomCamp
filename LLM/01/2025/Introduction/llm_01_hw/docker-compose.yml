# LLM Zoomcamp 2025 — Homework 1: Elasticsearch 8.17.6 (Q1 build_hash)
#
# Data: repo bind mount docker-data/volumes/elasticsearch-hw-data (follows repo drive).
#
# Docker Desktop (Windows) + bind on E::
#   If you see mkdir/stat errors for E:, add E:\ under Docker Desktop →
#   Settings → Resources → File sharing, then Quit Docker and retry.
#
# Compose from PowerShell in this folder (Git Bash URL mangling sometimes breaks binds):
#   docker compose down
#   docker compose up -d
#
# Do not run at the same time as LLM/01/2025/docker-compose.elasticsearch.yml (course stack) —
# both bind host port 9200.
#
# Start:   docker compose up -d
# Check:  curl http://127.0.0.1:9200
# Stop:   docker compose down

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: elasticsearch-hw
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - type: bind
        source: ../../../../docker-data/volumes/elasticsearch-hw-data
        target: /usr/share/elasticsearch/data
