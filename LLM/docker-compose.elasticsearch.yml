# ZoomCamp LLM — 데이터: ../docker-data/volumes/elasticsearch-data (저장소가 E:면 E:에만 쌓임)
# Windows: Docker Desktop → File sharing 에 해당 드라이브(E:\ 등) 추가 안 하면 바인드가 실패할 수 있음.
# 실행: docker compose -f docker-compose.elasticsearch.yml up -d
# 종료: docker compose -f docker-compose.elasticsearch.yml down

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - type: bind
        source: ../docker-data/volumes/elasticsearch-data
        target: /usr/share/elasticsearch/data
